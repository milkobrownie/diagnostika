<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Диагностика самоорганизации</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@600;800;900&family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0f0f0f; --card:#1a1a1a; --card2:#222; --line:#2a2a2a;
  --text:#f4efe8; --gray:#9b968f; --dim:#5f5b56;
  --orange:#f19a29; --red:#e3283e;
  --display:'Unbounded','DejaVu Sans','Arial Black',sans-serif;
  --body:'Manrope','Segoe UI',Roboto,Arial,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{background:var(--bg);color:var(--text);font-family:var(--body);font-size:15px;line-height:1.4;-webkit-text-size-adjust:100%}
body{min-height:100vh}
#app{max-width:480px;margin:0 auto;padding:max(14px,env(safe-area-inset-top)) 20px calc(28px + env(safe-area-inset-bottom))}
.top{display:flex;justify-content:space-between;align-items:center;padding:4px 0 14px}
.logo{font:900 14px var(--display);letter-spacing:.2px}
.logo i{display:inline-block;width:7px;height:7px;background:var(--orange);margin-left:3px;border-radius:1px}
.top .r{font:700 11px var(--body);letter-spacing:1.2px;color:var(--gray);text-transform:uppercase}
.top button.r{background:none;border:0;cursor:pointer;color:var(--gray)}
.kicker{font:800 11px var(--body);letter-spacing:1.4px;color:var(--orange);text-transform:uppercase;margin:0 0 12px}
h1{font:900 32px/1.08 var(--display);letter-spacing:-1px;margin:0 0 10px}
h2{font:900 22px/1.15 var(--display);letter-spacing:-.6px;margin:0 0 8px}
.pill{display:inline-block;background:var(--orange);color:#111;border-radius:12px;padding:3px 12px 5px;font-weight:900}
h1 .pill{font-size:26px;margin-top:4px}
.sub{color:var(--gray);font-size:15px;margin:0 0 20px}
.cats{display:flex;flex-direction:column;gap:9px;margin-bottom:20px}
.cat{display:flex;align-items:center;gap:13px;background:var(--card);border-radius:14px;padding:13px 16px}
.cat .ic{font-size:22px;width:28px;text-align:center}
.cat .t{flex:1}.cat .t b{display:block;font-weight:800;font-size:15px}
.cat .t span{color:var(--gray);font-size:13px}
.cat .n{font:900 13px var(--display);color:var(--orange)}
.btn{width:100%;display:flex;justify-content:space-between;align-items:center;background:var(--orange);color:#111;border:0;border-radius:14px;padding:17px 18px;font:800 15px var(--body);cursor:pointer}
.btn:active{transform:scale(.99)}
.note{color:var(--gray);font-size:13.5px;margin:16px 0 14px}
.note b{color:var(--text)}
.fine{border-top:1px solid var(--line);padding-top:14px;color:var(--dim);font-size:12px}
/* quiz */
.prog{display:grid;grid-template-columns:repeat(15,1fr);gap:4px;margin:0 0 22px}
.prog i{height:3px;border-radius:2px;background:var(--line)}
.prog i.on{background:var(--orange)}
.tag{display:flex;align-items:center;gap:8px;font:800 11px var(--body);letter-spacing:1.2px;color:var(--orange);text-transform:uppercase;margin-bottom:12px}
.tag .ic{font-size:15px}
.q{font:800 23px/1.2 var(--display);letter-spacing:-.6px;margin:0 0 10px}
.qs{color:var(--gray);font-size:13.5px;margin:0 0 18px}
.opts{display:flex;flex-direction:column;gap:9px}
.opt{display:flex;justify-content:space-between;align-items:center;background:var(--card);border:1.5px solid transparent;border-radius:12px;padding:15px 16px;font:700 15px var(--body);color:var(--text);cursor:pointer;text-align:left;width:100%}
.opt .rad{width:20px;height:20px;border-radius:50%;border:1.6px solid #55524d;flex:0 0 auto;position:relative}
.opt.sel{border-color:var(--orange);background:#241a0c}
.opt.sel .rad{border-color:var(--orange)}
.opt.sel .rad:after{content:"";position:absolute;inset:3px;border-radius:50%;background:var(--orange)}
.row{display:flex;justify-content:space-between;align-items:center;margin:16px 0 0;color:var(--gray);font-size:12.5px;min-height:20px}
.row button{background:none;border:0;color:var(--gray);font:inherit;cursor:pointer;padding:6px 0}
.left{margin-top:20px;border:1px dashed #3a3a3a;border-radius:12px;padding:13px 15px;color:var(--gray);font-size:13.5px}
.left b{color:var(--text)}
/* result */
.map{background:var(--card);border-radius:18px;padding:6px 18px;margin:0 0 14px}
.mrow{padding:14px 0;border-top:1px solid var(--line)}
.mrow:first-child{border-top:0}
.mh{display:flex;align-items:center;gap:10px;margin-bottom:9px}
.mh .ic{font-size:19px;width:24px;text-align:center}
.mh b{flex:1;font-weight:800;font-size:15px}
.mh .sc{font:900 14px var(--display)}
.mh .sc small{color:var(--gray);font-weight:700;font-size:12px}
.mh .sc.bad{color:var(--red)}
.seg{display:grid;grid-template-columns:repeat(12,1fr);gap:4px;margin-left:34px}
.seg i{height:7px;border-radius:2px;background:#2b2b2b}
.seg i.on{background:var(--orange)}
.seg.bad i.on{background:var(--red)}
.warn{margin:10px 0 0 34px;font-size:12.5px;color:var(--gray);line-height:1.35}
.warn b{color:var(--red);font-weight:800;margin-right:4px}
.warn.t1 b,.warn.grow b{color:var(--orange)}
.warn.t3 b{text-transform:uppercase;letter-spacing:.3px}
.save{color:var(--gray);font-size:12.5px;margin:0 0 30px}
.step2 .opt{padding:14px 16px}
.opt .l{display:flex;align-items:center;gap:11px}
.opt .l .ic{font-size:18px;width:22px;text-align:center}
.opt .r{display:flex;align-items:center;gap:12px}
.opt .badge{color:var(--red);font:800 10.5px var(--body);letter-spacing:.3px}
.bar{position:fixed;left:0;right:0;bottom:0;background:var(--bg);border-top:1px solid var(--line);padding:12px 20px calc(12px + env(safe-area-inset-bottom));z-index:5}
.bar .btn{max-width:440px;margin:0 auto}
.pad{height:90px}
.hide{display:none!important}
.fade{animation:f .25s ease}
@keyframes f{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
</style>
</head>
<body>
<div id="app"></div>

<script>
/* ============ НАСТРОЙКИ ============ */
const CHAT_USERNAME = 'milkobrownie';       // <- ник, чей чат откроется (без @)
const NAME_ON_COVER = 'СБОРКА';             // название в шапке

/* ============ ДАННЫЕ ============ */
const CATS = [
  {name:'Фокус', sub:'Телефон и отвлечения', icon:'📱', notes:{
    t3:'Телефон управляет твоим днём: внимание почти не принадлежит тебе, дела тонут в ленте и переписках.',
    t2:'Телефон забирает внимание: «на минутку» превращается в полчаса, а дела откладываются.',
    t1:'Фокус держится, но отвлечения регулярно выбивают из дела и съедают время.',
    grow:'Фокус в порядке. Здесь можно подтянуть: убрать ленту с главного экрана и выделить часы без телефона.'}},
  {name:'Старт', sub:'Откладывание важного', icon:'🚀', notes:{
    t3:'Важное почти не начинается: дела копятся, и каждое откладывание делает старт ещё тяжелее.',
    t2:'Знаешь, что делать, но стартуешь поздно или не стартуешь вовсе: ждёшь настроения и теряешь дни.',
    t1:'Старт даётся не всегда: крупные задачи часто откладываются на «потом».',
    grow:'Со стартом неплохо. Здесь можно подтянуть: делить большие задачи на первый шаг в две минуты.'}},
  {name:'Приоритеты', sub:'Время на то, что двигает к деньгам', icon:'🎯', notes:{
    t3:'Силы уходят на чужое и срочное: то, что двигает к деньгам, почти не получает времени.',
    t2:'Занят много, а то, что двигает к деньгам, остаётся на потом.',
    t1:'Главное не всегда получает лучшие часы дня: срочное иногда перебивает важное.',
    grow:'С приоритетами хорошо. Здесь можно подтянуть: закрепить лучшие часы дня за одним делом, которое двигает к деньгам.'}},
  {name:'Силы', sub:'Сон, тело и привычки', icon:'🔋', notes:{
    t3:'Ресурс на нуле: недосып и усталость съедают всё, на дела сил почти не остаётся.',
    t2:'Сон и усталость забирают ресурс: к вечеру сил хватает только на телефон или сериал.',
    t1:'Силы проседают: сон или привычки периодически отнимают энергию на важное.',
    grow:'Силы в норме. Здесь можно подтянуть: ровный режим сна и спокойный вечерний ритуал.'}},
  {name:'Возврат после срыва', sub:'Как быстро возвращаешься в строй', icon:'🔁', notes:{
    t3:'Срыв надолго выбивает из колеи: один пропуск превращается в отказ от всего.',
    t2:'Начинаешь хорошо, но один пропуск превращается в долгую паузу.',
    t1:'Возвращаешься в строй не сразу: после срыва проходит несколько дней, прежде чем снова войдёшь в ритм.',
    grow:'Возврат у тебя быстрый. Здесь можно подтянуть: заранее продумать, что делаешь в первый день после пропуска.'}}
];
// [индекс темы, текст вопроса]
const Q = [
  [0,'Беру телефон «на минутку» — и залипаю на полчаса.'],
  [1,'Знаю, что надо сделать, но откладываю «на потом».'],
  [2,'Весь день чем-то занят, а до главного так и не дошли руки.'],
  [3,'Ложусь поздно и утром встаю разбитым.'],
  [4,'Пропустил день — и дальше бросаю совсем.'],
  [0,'Сажусь за дело, а через пять минут уже листаю ленту или переписки.'],
  [1,'Жду настроения, чтобы взяться за дело.'],
  [2,'Делаю то, что срочно просят другие, а своё откладываю.'],
  [3,'Усталость заедаю, запиваю или закуриваю.'],
  [4,'После срыва говорю себе: «Начну с понедельника».'],
  [0,'Вечером не могу вспомнить, на что ушёл день.'],
  [1,'Задача кажется такой большой, что непонятно, с чего начать, — и я не начинаю.'],
  [2,'Не могу сразу сказать, какое дело сейчас сильнее всего двинет меня к деньгам.'],
  [3,'К вечеру нет сил ни на что, кроме телефона или сериала.'],
  [4,'Злюсь на себя за срыв, и от этого руки опускаются ещё сильнее.']
];
const OPTS = ['Никогда','Редко','Иногда','Часто','Почти всегда'];  // баллы: 4,3,2,1,0 (чем выше, тем крепче опора)
const NOTE_LIMIT = 6;   // подпись у темы, если баллов меньше 6 из 12 (чем меньше, тем серьёзнее)
// уровень: 0–1 критично, 2–3 серьёзно, 4–5 умеренно
function tier(v){ return v<=1 ? 't3' : v<=3 ? 't2' : 't1'; }
const LABELS = {t3:'Критическая точка', t2:'Точка внимания', t1:'Зона внимания', grow:'Можно подтянуть'};
// какие темы получают подпись: все < 6; если таких нет — самая слабая (подсказка, что подтянуть)
function notesFor(sc){
  const m = {};
  sc.forEach((v,k)=>{ if(v<NOTE_LIMIT) m[k] = tier(v); });
  if(!Object.keys(m).length){ let k=0; sc.forEach((v,j)=>{ if(v<sc[k]) k=j; }); m[k] = 'grow'; }
  return m;
}

/* ============ СОСТОЯНИЕ ============ */
const tg = window.Telegram && window.Telegram.WebApp;
if (tg) { try { tg.ready(); tg.expand(); tg.setHeaderColor('#0f0f0f'); tg.setBackgroundColor('#0f0f0f'); } catch(e){} }
const S = {screen:'intro', i:0, a:Array(15).fill(null), theme:null};
const $ = document.getElementById('app');
const pad = n => String(n).padStart(2,'0');

function head(right, onclick){
  const r = onclick ? `<button class="r" onclick="${onclick}">${right}</button>` : `<span class="r">${right}</span>`;
  return `<div class="top"><div class="logo">${NAME_ON_COVER}<i></i></div>${r}</div>`;
}
function scores(){
  const s = [0,0,0,0,0];
  Q.forEach((q,k)=>{ if(S.a[k]!==null) s[q[0]] += 4 - S.a[k]; });
  return s;
}

/* ============ ЭКРАНЫ ============ */
function intro(){
  $.innerHTML = `<div class="fade">${head('Диагностика')}
  <div class="kicker">15 вопросов · 3 минуты · в конце — мой комментарий</div>
  <h1>Диагностика<br><span class="pill">самоорганизации</span></h1>
  <p class="sub">Где ты держишься крепко, а где теряешь время, силы и деньги.</p>
  <div class="cats">${CATS.map((c,k)=>`<div class="cat"><div class="ic">${c.icon}</div><div class="t"><b>${c.name}</b><span>${c.sub}</span></div><div class="n">${pad(k+1)}</div></div>`).join('')}</div>
  <button class="btn" onclick="start()"><span>Начать диагностику</span><span>→</span></button>
  <p class="note">Отвечай, как было за последние две недели. В конце увидишь свою карту и сможешь получить <b>мой личный комментарий по твоей ситуации</b>.</p>
  <div class="fine">Это не психологическая и не медицинская диагностика: карта строится по твоим ответам.</div></div>`;
  window.scrollTo(0,0);
}
function start(){ S.screen='q'; S.i=0; S.a=Array(15).fill(null); S.theme=null; question(); }

function question(){
  const k = S.i, [c,text] = Q[k], cat = CATS[c];
  const prog = Array.from({length:15},(_,j)=>`<i class="${j<k?'on':''}"></i>`).join('');
  const left = 15-k;
  const leftBox = k>=12 ? `<div class="left">Осталось ${left}. Дальше — твоя карта и <b>мой личный комментарий по твоей ситуации</b>.</div>` : '';
  $.innerHTML = `<div class="fade">${head(pad(k+1)+' / 15')}
  <div class="prog">${prog}</div>
  <div class="tag"><span class="ic">${cat.icon}</span>${cat.name.toUpperCase()}</div>
  <div class="q">${text}</div>
  <div class="qs">Как часто так было за последние две недели?</div>
  <div class="opts">${OPTS.map((o,j)=>`<button class="opt ${S.a[k]===j?'sel':''}" onclick="answer(${j})"><span>${o}</span><span class="rad"></span></button>`).join('')}</div>
  <div class="row"><span>${k>0?'<button onclick="back()">← Назад</button>':''}</span><span>Правильных ответов нет</span></div>
  ${leftBox}</div>`;
  window.scrollTo(0,0);
}
function answer(j){
  S.a[S.i] = j;
  [...document.querySelectorAll('.opt')].forEach((b,x)=>b.classList.toggle('sel',x===j));
  setTimeout(()=>{ if(S.i<14){ S.i++; question(); } else { S.screen='result'; result(); } }, 220);
}
function back(){ if(S.i>0){ S.i--; question(); } }

function result(){
  const sc = scores(), nm = notesFor(sc);
  const rows = CATS.map((c,k)=>{
    const t = nm[k], red = sc[k] <= 3;
    const seg = Array.from({length:12},(_,j)=>`<i class="${j<sc[k]?'on':''}"></i>`).join('');
    return `<div class="mrow"><div class="mh"><span class="ic">${c.icon}</span><b>${c.name}</b><span class="sc ${red?'bad':''}">${sc[k]}<small>/12</small></span></div>
      <div class="seg ${red?'bad':''}">${seg}</div>
      ${t?`<div class="warn ${t}"><b>● ${LABELS[t]}</b>${c.notes[t]}</div>`:''}</div>`;
  }).join('');
  $.innerHTML = `<div class="fade">${head('Пройти заново ↗','restart()')}
  <div class="kicker">Шаг 1 из 2 · твой результат</div>
  <h1 style="font-size:28px">Твоя карта<br><span class="pill" style="font-size:22px">самоорганизации</span></h1>
  <p class="sub" style="margin-bottom:16px">Чем полнее шкала, тем крепче опора.</p>
  <div class="map">${rows}</div>
  <div class="save">📸 Сохрани скрин карты — вернёмся к ней, когда будем разбирать твою ситуацию.</div>
  <div id="step2" class="step2">
    <div class="kicker">Шаг 2 из 2 · личный комментарий</div>
    <h2>Что сейчас мешает сильнее всего?</h2>
    <p class="sub" style="font-size:13.5px;margin-bottom:14px">Выбери по ощущению — не обязательно самую короткую шкалу. По этой теме я и дам тебе комментарий.</p>
    <div class="opts">${CATS.map((c,k)=>`<button class="opt ${S.theme===k?'sel':''}" onclick="pick(${k})"><span class="l"><span class="ic">${c.icon}</span>${c.name}</span><span class="r">${nm[k]?'<span class="badge">по карте</span>':''}<span class="rad"></span></span></button>`).join('')}</div>
    <div class="fine" style="margin-top:18px">Это не психологическая и не медицинская диагностика: карта строится по твоим ответам. Баллы и выбранная тема отправятся мне в сообщении, чтобы я мог дать комментарий.</div>
  </div>
  <div class="pad"></div></div>
  <div class="bar"><button class="btn" id="go" onclick="go()"><span id="golbl">Шаг 2: получить личный комментарий</span><span id="goar">↓</span></button></div>`;
  window.scrollTo(0,0);
  refreshBtn();
}
function refreshBtn(){
  const has = S.theme!==null;
  const l = document.getElementById('golbl'), a = document.getElementById('goar');
  if(l){ l.textContent = has ? 'Получить личный комментарий' : 'Шаг 2: получить личный комментарий'; a.textContent = has ? '→' : '↓'; }
}
function pick(k){
  S.theme = k;
  [...document.querySelectorAll('#step2 .opt')].forEach((b,x)=>b.classList.toggle('sel',x===k));
  refreshBtn();
}
function restart(){ S.screen='intro'; intro(); }

/* ============ ОТПРАВКА В БОТ ============ */
function go(){
  if(S.theme===null){ document.getElementById('step2').scrollIntoView({behavior:'smooth',block:'start'}); return; }
  const sc = scores();
  const line = CATS.map((c,k)=>`${c.name} ${sc[k]}/12`).join(', ');
  const text = `Привет! Прошёл диагностику. Сильнее всего проседает: ${CATS[S.theme].name}. Хочу личный комментарий по моей ситуации. Результат: ${line}`;
  const url = `https://t.me/${CHAT_USERNAME}?text=${encodeURIComponent(text)}`;
  try{ if(navigator.clipboard) navigator.clipboard.writeText(text); }catch(e){}   // запасной вариант, если текст не подставится сам
  if(tg && tg.openTelegramLink){ tg.openTelegramLink(url); setTimeout(()=>{ try{tg.close();}catch(e){} }, 400); }
  else { window.open(url,'_blank'); }
}

intro();
</script>
</body>
</html>
